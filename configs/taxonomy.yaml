# L1 7-class — 이번 프로젝트의 학습 대상 (Head A)
#
# 이 라벨은 사용자에게 직접 노출하지 않는다 (DECISIONS.md D-04).
# 사용자 표시 라벨은 L2이며, L1 -> L2 는 one-to-many 이므로
# L1 분류기 단독으로는 만들 수 없다. configs/l1_to_l2_projection.md 참조.
#
# 이름은 기존 configs/dataset_registry.json 의 coarse_detection_classes 와 동일하게
# 유지한다. 이름을 바꾸면 데이터셋 5개의 class_map 을 전부 다시 써야 한다.

version: 1
level: L1
task: single_label_classification
sample_unit: crop        # DECISIONS.md D-01

classes:
  - id: 0
    name: crack
    request_alias: crack
    display_ko: 균열
  - id: 1
    name: breakage
    request_alias: breakage
    display_ko: 파손·박리
  - id: 2
    name: stain_corrosion
    request_alias: stain_discoloration
    display_ko: 오염·부식
  - id: 3
    name: moisture_leak
    request_alias: moisture_leak
    display_ko: 습기·누수
  - id: 4
    name: lifting
    request_alias: lifting_peeling
    display_ko: 들뜸
  - id: 5
    name: mold
    request_alias: mold
    display_ko: 곰팡이
  - id: 6
    name: finish_damage
    request_alias: 기타 통합 클래스
    display_ko: 마감 손상

# 교차 출처 검증 가능 여부 — 노트북 01 에서 duplicate_group_id 기준으로 확정한다.
# 여기 값은 계획 시점의 추정이며 노트북 01 이 덮어쓴다.
cross_source_validation_estimate:
  crack: possible            # kaggle / aihub / roboflow_wall_defects
  breakage: possible         # DACON / aihub
  mold: single_source        # 사실상 DACON
  stain_corrosion: single_source
  finish_damage: single_source
  lifting: single_source
  moisture_leak: single_source   # roboflow_wall_defects 150장 only

# NORMAL 은 L1 class 가 아니다. 정상 판별은 v1 범위 밖이며
# OOD 게이트(노트북 11)에서 abstention 으로 처리한다.
normal_is_a_class: false
